name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.compiler }} / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        preset: [debug, release]
    env:
      CXX: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build flex g++ clang
      - name: Configure
        run: cmake --preset "${{ matrix.preset }}" -DINT3402E_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset "${{ matrix.preset }}" --parallel 2
      - name: Test
        run: ctest --preset "${{ matrix.preset }}"
      - name: Verify build without test dependencies
        if: matrix.compiler == 'g++' && matrix.preset == 'release'
        run: |
          cmake -S . -B build/no-tests -G Ninja -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build/no-tests --parallel 2
